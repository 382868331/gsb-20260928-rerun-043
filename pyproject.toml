[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crp-deid"
version = "0.1.0"
description = "Clinical research data platform: batch/rule/version management and de-identified export"
requires-python = ">=3.10"

[project.scripts]
crp = "crp.cli:main"

[tool.setuptools.packages.find]
include = ["crp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
